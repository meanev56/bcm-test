<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout</title>
  <link rel="stylesheet" href="q4-styles.css">
</head>
<body>
  <main class="grid">
    <section class="card a" aria-label="Section A">
      <h2>A — a very long heading that should wrap gracefully on both layouts without overflowing its card or breaking the grid</h2>
    </section>
    <section class="card b" aria-label="Section B"><h2>B</h2></section>
    <section class="card c" aria-label="Section C"><h2>C</h2></section>
    <section class="card d" aria-label="Section D"><h2>D</h2></section>
    <section class="card e" aria-label="Section E"><h2>E</h2></section>
    <section class="card f" aria-label="Section F"><h2>F</h2></section>
    <section class="card g" aria-label="Section G"><h2>G</h2></section>
    <section class="card h" aria-label="Section H"><h2>H</h2></section>
  </main>
</body>
</html>
